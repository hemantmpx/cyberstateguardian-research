[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberstateguardian-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9", "requests>=2.32", "pydantic-settings>=2.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberstateguardian_probe*"]
