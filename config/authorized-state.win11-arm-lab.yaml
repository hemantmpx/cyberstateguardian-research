    # This is a narrow, captured research baseline. Objects not listed here
    # remain UNKNOWN and are intentionally visible to the experiment.
    expected_services:
      - object_key: service:wazuhsvc
        name: Wazuh
        allowed_operations: [ADD, MODIFY]
